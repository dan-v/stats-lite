name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=${GITHUB_REF_NAME#v}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $v" resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" resources/Info.plist

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: |
          mkdir dist && ditto build/StatsLite.app "dist/Stats Lite.app"
          ditto -c -k --keepParent "dist/Stats Lite.app" StatsLite.zip
          shasum -a 256 StatsLite.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StatsLite
          path: StatsLite.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" StatsLite.zip --title "Stats Lite $GITHUB_REF_NAME" --generate-notes
